---
upgrade:
  - |
    Adds ``DD_CELERY_PRODUCER_SERVICE``, ``DD_CELERY_WORKER_SERVICE``, and
    ``DD_DJANGO_CACHE_SERVICE`` as canonical environment variables for
    overriding the service tag on celery producer spans, celery worker spans,
    and django cache spans respectively. The previously documented
    ``DD_CELERY_PRODUCER_SERVICE_NAME``, ``DD_CELERY_WORKER_SERVICE_NAME``,
    and ``DD_DJANGO_CACHE_SERVICE_NAME`` forms continue to work as aliases
    of the new canonical names.
